<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Dumbbell Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Bar -->
    <rect x="156" y="238" width="200" height="36" rx="10" fill="url(#iconGrad)" />
    
    <!-- Left Plate Inner -->
    <rect x="180" y="156" width="32" height="200" rx="12" fill="url(#iconGrad)" />
    <!-- Left Plate Outer -->
    <rect x="136" y="186" width="28" height="140" rx="10" fill="url(#iconGrad)" />
    <!-- Left Collar -->
    <rect x="220" y="222" width="16" height="68" rx="6" fill="#e2e8f0" opacity="0.9" />

    <!-- Right Plate Inner -->
    <rect x="300" y="156" width="32" height="200" rx="12" fill="url(#iconGrad)" />
    <!-- Right Plate Outer -->
    <rect x="348" y="186" width="28" height="140" rx="10" fill="url(#iconGrad)" />
    <!-- Right Collar -->
    <rect x="276" y="222" width="16" height="68" rx="6" fill="#e2e8f0" opacity="0.9" />
  </g>
</svg>
